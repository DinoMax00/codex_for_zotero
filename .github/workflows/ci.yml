name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: python -m pip install 'pymupdf>=1.26,<2' 'pillow>=10'
      - run: python skills/zotero-paper-annotator/scripts/test_paper.py
      - run: python skills/zotero-library-manager/scripts/library.py --help
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            dist/codex-for-zotero-*.xpi
            dist/codex-for-zotero-skills-*.zip
            dist/updates.json
            dist/SHA256SUMS
          if-no-files-found: error
